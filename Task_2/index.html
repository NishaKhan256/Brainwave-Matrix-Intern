<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <button id="dark-mode-toggle"><i class="fas fa-sun"></i></button>
        <div class="balance">Total Balance: <span id="balance">$0.00</span></div>
        
        <div class="transaction-form">
            <input type="text" id="description" placeholder="Enter Description">
            <input type="number" id="amount" placeholder="Amount">
            <select id="category">
                <option value="food">Food</option>
                <option value="bills">Bills</option>
                <option value="travel">Travel</option>
                <option value="entertainment">Entertainment</option>
                <option value="shopping">Shopping</option>
            </select>
            <button id="add-transaction">Add Transaction</button>
        </div>
        
        <h2>Transactions</h2>
        <input type="text" id="search" placeholder="Search transactions...">
        <ul id="transaction-list"></ul>
    </div>
</body>
</html>
